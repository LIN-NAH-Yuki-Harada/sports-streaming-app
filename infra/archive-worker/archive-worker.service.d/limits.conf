# アーカイブ変換の I/O を制限して、ライブ配信の録画書き込みを守る（2026-08-07）
#
# ★なぜ drop-in か: 本体 unit を触らずに追加でき、このファイルを削除するだけで元に戻る。
#
# ★なぜ ionice ではダメだったか（本体 unit の IOSchedulingClass=idle は本番で no-op）:
#   ①このVPSの I/O スケジューラは mq-deadline で、ioprio を尊重するのは CFQ/BFQ のみ
#   ②より本質的に、**バッファ書き込みは writeback スレッドがデバイスへ出す**ため、
#     ffmpeg の ioprio は原理的に届かない
#   → cgroup v2 の io.max は blk-throttle でスケジューラの上流にあり、
#     ext4 は cgroup writeback 対応なので**バッファ書き込みも捕まる**
#
# ★40M の根拠: 録画は1本 0.5MB/s（3本でも1.5MB/s）。ffmpeg を 40MB/s に絞っても
#   中間ファイル4.7GB は約2分で書き終わり、エンコード自体（30分）が律速なので
#   **アーカイブは遅くならない**。10MB/s を下回ると遅くなり始めるので下げすぎないこと。
[Service]
IOAccounting=yes
IOWriteBandwidthMax=/var/tmp 40M
IOReadBandwidthMax=/var/tmp 40M
# OOM kill せずに絞るだけ（MemoryMax ではない）
MemoryHigh=1200M
